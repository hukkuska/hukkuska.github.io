<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>HUK KUSKA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;overflow:hidden}
  body{
    height:100dvh;display:flex;align-items:center;justify-content:center;
    font-family:'Space Mono','Courier New',monospace;color:#fff;
    padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  }

  /* ARQUITECTURA EN CAPAS */
  .stage{
    position:relative;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    width:100%;max-width:420px;margin-top:-3dvh;
    isolation:isolate;
  }

  /* 1º — CAPA SUPERIOR (z-index: 30): ISOTIPO */
  .layer-logo{
    position:relative;
    z-index:30;
    margin-bottom:clamp(22px,4.8dvh,38px);
  }
  #logo{
    width:min(54vw,38dvh,230px);
    aspect-ratio:1;
    opacity:0;
    will-change:opacity;
  }
  /* Subida de luz constante y uniforme de 0 a 1 en 2.6s sin pausas */
  #logo.emerge{
    animation:shadowEmerge 2.6s linear forwards;
  }
  @keyframes shadowEmerge{
    0%{opacity:0}
    100%{opacity:1}
  }
  #logo.done{
    opacity:1;
  }

  /* Respiración continua que arranca exactamente en opacity: 1 para evitar saltos */
  .breath{width:100%;height:100%}
  #logo.done .breath{animation:breathe 5s ease-in-out infinite}
  @keyframes breathe{
    0%,100%{transform:scale(1);opacity:1;filter:drop-shadow(0 0 0 rgba(255,255,255,0))}
    50%{transform:scale(1.045);opacity:.86;filter:drop-shadow(0 0 14px rgba(255,255,255,.28))}
  }

  /* Glitch con capas fantasmas */
  svg{width:100%;height:100%;display:block;overflow:visible}
  .ghost{opacity:0}
  .glitch svg{animation:gl .15s steps(2) 1}
  .glitch .ghost.g1{opacity:.55;transform:translate(-120px,40px)}
  .glitch .ghost.g2{opacity:.4;transform:translate(120px,-40px)}
  @keyframes gl{
    0%{transform:translate(3px,0) skewX(6deg);clip-path:inset(10% 0 55% 0)}
    50%{transform:translate(-4px,0) skewX(-8deg);clip-path:inset(50% 0 10% 0)}
    100%{transform:none;clip-path:inset(0)}
  }

  /* 2º — CAPA BASE (z-index: 10): FRASE DE CONEXIÓN EN UN SOLO RENGLÓN */
  .layer-terminal{
    position:relative;
    z-index:10;
    width:100%;
    margin-bottom:clamp(22px,4.8dvh,38px);
  }
  .status{
    font-size:clamp(9.5px,2.7vw,11px);
    letter-spacing:.24em;
    color:#777;
    min-height:1.4em;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .cursor{
    display:inline-block;
    width:.5em;height:.95em;
    background:#777;
    vertical-align:-2px;
    margin-left:3px;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* 3º y 4º — CAPA DE ACCIÓN (z-index: 20): FRASE GANCHO + CTA */
  .layer-action{
    position:relative;
    z-index:20;
    display:flex;flex-direction:column;align-items:center;
    gap:clamp(24px,5dvh,40px);
    width:100%;
  }
  .hook{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(22px,6.2vw,28px);
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.22;
    max-width:340px;
    color:#fff;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .95s ease,transform .95s ease;
  }
  .cta{
    opacity:0;
    transform:translateY(6px);
    transition:opacity .95s ease,transform .95s ease,background .12s,color .12s;
    font:700 13px 'Space Mono','Courier New',monospace;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#fff;
    background:#000;
    border:1px solid rgba(255,255,255,.45);
    padding:18px 26px;
    min-width:260px;
    cursor:pointer;
    touch-action:manipulation;
    border-radius:0;
  }
  .show{opacity:1;transform:translateY(0)}
  .cta:hover,.cta:active,.cta.flash{background:#fff;color:#000;border-color:#fff}
  .cta.flash{animation:gl .12s steps(2) 1}

  @media (prefers-reduced-motion:reduce){
    #logo.done .breath{animation:none}
    #logo.emerge{animation-duration:.01s}
  }
</style>
<!-- UMAMI ANALYTICS: Medición sin cookies -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="504e6cc5-5ef4-42f4-823c-427877231a89"></script>
</head>
<body>

<main class="stage">

  <!-- 1º ISOTIPO -->
  <section class="layer-logo">
    <div id="logo">
      <div class="breath">
        <svg viewBox="-40 1240 10080 7600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Huk Kuska">
          <defs>
            <g id="iso" fill="#FFFFFF">
              <path fill-rule="nonzero" d="M5301.314,8696.496C5180.883,8693.499 5073.9,8571.246 5074.973,8450.796L5083.25,7519.395C5084.305,7398.075 5183.87,7299.389 5305.208,7299.389L5305.337,7299.389L5920.053,7299.037L6798.597,5593.873L5000.194,5585.836L3201.801,5593.873L4080.317,7299.426L4703.616,7299.389L4703.736,7299.389C4744.367,7299.389 4784.656,7309.794 4819.09,7331.372C4887.088,7373.973 4925.684,7444.672 4925.703,7521.328L4925.823,8452.739C4925.842,8574.159 4839.641,8693.481 4718.239,8696.496L3229.881,8696.496C3148.804,8698.512 3074.211,8670.266 3036.161,8598.651L2198.155,7022.298L1454.998,8367.592C1338.738,8578.044 1120.258,8697.069 895.314,8697.079C791.013,8697.088 685.371,8671.524 587.794,8617.62L329.885,8475.149C180.671,8392.722 72.495,8257.122 25.27,8093.332C-21.956,7929.532 -2.561,7757.149 79.866,7607.944L3385.717,1623.593C3414.953,1570.661 3465.277,1531.51 3523.795,1516.194L3911.208,1414.797L4302.506,1309.701C4403.902,1282.463 4507.574,1339.723 4538.494,1440.075L4657.824,1827.192L4778.246,2209.166C4796.43,2266.843 4790.094,2330.272 4760.858,2383.214L3699.045,4305.359L5000.194,4311.176L6301.353,4305.359L5239.549,2383.251C5210.304,2330.319 5203.959,2266.861 5222.143,2209.166L5342.565,1827.201L5461.895,1440.066C5492.824,1339.723 5596.468,1282.435 5697.902,1309.701L6089.134,1414.788L6476.584,1516.185C6535.112,1531.51 6585.445,1570.661 6614.69,1623.603L9920.541,7607.944C10090.695,7915.964 9978.523,8304.995 9670.503,8475.149L9412.604,8617.62C9104.557,8787.765 8715.544,8675.612 8545.4,8367.592L7802.234,7022.298L6964.228,8598.679C6927.01,8668.675 6856.302,8696.487 6777.398,8696.496L5301.314,8696.496"/>
            </g>
          </defs>
          <use href="#iso" class="ghost g1" style="fill:#aaa"/>
          <use href="#iso" class="ghost g2" style="fill:#666"/>
          <use href="#iso"/>
        </svg>
      </div>
    </div>
  </section>

  <!-- 2º FRASE DE CONEXIÓN -->
  <section class="layer-terminal">
    <div class="status" id="status" aria-live="polite"><span id="typed"></span><span class="cursor"></span></div>
  </section>

  <!-- 3º FRASE GANCHO + 4º CTA -->
  <section class="layer-action">
    <p class="hook" id="hook">¿Estás cansado de la monotonía?</p>
    <button class="cta" id="cta" type="button">[ Romper el ciclo ]</button>
  </section>

</main>

<script>
(function(){
  var URL_WA = 'https://walink.co/pg5x0b';
  var logo = document.getElementById('logo');
  var typed = document.getElementById('typed');
  var hook = document.getElementById('hook');
  var cta = document.getElementById('cta');
  var MSG = '[ SEÑAL // ACTIVA ]';

  function intro(){
    logo.classList.add('emerge');
    setTimeout(function(){
      logo.classList.remove('emerge');
      logo.classList.add('done');
    }, 2600);

    setTimeout(type, 1600);
  }

  function type(){
    var i = 0;
    var t = setInterval(function(){
      typed.textContent = MSG.slice(0, ++i);
      if(i >= MSG.length){
        clearInterval(t);
        setTimeout(function(){ hook.classList.add('show'); }, 350);
        setTimeout(function(){ cta.classList.add('show'); }, 950);
      }
    }, 34);
  }

  function glitchLoop(){
    setTimeout(function(){
      logo.classList.add('glitch');
      setTimeout(function(){ logo.classList.remove('glitch'); }, 150);
      glitchLoop();
    }, 4000 + Math.random()*2000);
  }

  var fired = false;
  cta.addEventListener('click', function(){
    if(fired) return; fired = true;
    cta.classList.add('flash'); logo.classList.add('glitch');
    try{
      if(window.umami && typeof window.umami.track === 'function'){
        window.umami.track('click-whatsapp', { destino: 'walink' });
      }
    }catch(e){}
    setTimeout(function(){ window.location.href = URL_WA; }, 120);
  });

  window.addEventListener('load', function(){
    intro();
    setTimeout(glitchLoop, 2600);
  });
})();
</script>
</body>
</html>
